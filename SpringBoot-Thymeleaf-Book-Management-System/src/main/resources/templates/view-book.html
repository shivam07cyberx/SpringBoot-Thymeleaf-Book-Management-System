<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Library Books</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif}
body{
background:linear-gradient(135deg,#667eea,#764ba2);
min-height:100vh;padding:30px;color:#222}
.header{display:flex;justify-content:space-between;align-items:center;gap:20px;
background:rgba(255,255,255,.15);backdrop-filter:blur(18px);
padding:20px 30px;border-radius:20px;color:#fff}
.header-right{display:flex;gap:15px;align-items:center}
.search-form{display:flex;gap:10px}
.search-form input{padding:12px 16px;width:280px;border:none;border-radius:10px}
.search-form button,.add-btn{
padding:12px 18px;border:none;border-radius:10px;font-weight:bold;
text-decoration:none;color:#fff;background:#2563eb;cursor:pointer}
.add-btn{background:#22c55e}
.success{margin:20px 0;background:#d1fae5;padding:15px;border-radius:10px}
.container{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:25px;margin-top:25px}
.card{
background:rgba(255,255,255,.18);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.3);
border-radius:22px;
padding:22px;
box-shadow:0 15px 30px rgba(0,0,0,.2);
transition:.3s}
.card:hover{transform:translateY(-8px)}
.book-name{font-size:26px;color:#fff;margin-bottom:8px}
.subtitle{color:#eef;margin-bottom:18px}
.info{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.25);color:#fff}
.badges{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.badge{padding:8px 14px;border-radius:20px;color:#fff;font-weight:bold}
.price{background:#2563eb}
.total{background:#7c3aed}
.available{background:#16a34a}
.desc{background:rgba(255,255,255,.2);padding:15px;border-radius:12px;color:#fff;line-height:1.6;min-height:90px}
.actions{display:flex;gap:12px;margin-top:20px}
.actions a{flex:1;text-align:center;padding:12px;border-radius:10px;text-decoration:none;color:#fff;font-weight:bold}
.edit{background:#f59e0b}
.delete{background:#ef4444}
.footer{text-align:center;margin-top:35px}
.footer a{color:#fff;font-weight:bold;text-decoration:none}
@media(max-width:768px){
.header{flex-direction:column}
.header-right,.search-form{width:100%;flex-direction:column}
.search-form input,.search-form button,.add-btn{width:100%}
}
</style>
</head>
<body>

<div class="header">
<h1>📚 Library Books</h1>
<div class="header-right">
<form th:action="@{/books/search}" method="get" class="search-form">
<input type="text" name="keyword" th:value="${keyword}" placeholder="🔍 Search by Book Name">
<button type="submit">Search</button>
</form>
<a class="add-btn" th:href="@{/books/add-form}">➕ Add Book</a>
</div>
</div>

<div class="success" th:if="${msg}">
<span th:text="${msg}"></span>
</div>

<div class="container">

<div class="card" th:each="book : ${books}">

<h2 class="book-name" th:text="${book.bookname}">Book Name</h2>
<div class="subtitle" th:text="${book.title}">Title</div>

<div class="info"><strong>👤 Author</strong><span th:text="${book.author}"></span></div>
<div class="info"><strong>🏷 Category</strong><span th:text="${book.category}"></span></div>

<div class="badges">
<span class="badge price">💰 ₹<span th:text="${book.price}"></span></span>
<span class="badge total">📦 Total: <span th:text="${book.bookCount}"></span></span>
<span class="badge available">✅ Available: <span th:text="${book.availableBookCount}"></span></span>
</div>

<div class="desc">
<strong>Description</strong><br><br>
<span th:text="${book.description}"></span>
</div>

<div class="actions">
<a class="edit" th:href="@{/books/edit/{id}(id=${book.bookId})}">✏ Edit</a>
<a class="delete"
th:href="@{/books/delete/{id}(id=${book.bookId})}"
onclick="return confirm('Delete this book?')">🗑 Delete</a>
</div>

</div>

</div>

<div class="footer">
<a th:href="@{/dashboard}">⬅ Back to Dashboard</a>
</div>

</body>
</html>
