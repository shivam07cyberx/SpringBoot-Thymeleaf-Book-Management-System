<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Register</title>

<style>

/* ===========================
   Tablet (768px and below)
=========================== */
@media (max-width:768px){

    .container{
        width:90%;
        padding:35px 25px;
    }

    h1{
        font-size:30px;
    }

    p{
        font-size:16px;
    }

    .btn{
        font-size:17px;
        padding:13px;
    }

}

/* ===========================
   Mobile (480px and below)
=========================== */
@media (max-width:480px){

    body{
        padding:20px;
    }

    .container{
        width:100%;
        padding:30px 20px;
        border-radius:12px;
    }

    h1{
        font-size:26px;
    }

    p{
        font-size:15px;
        margin-bottom:25px;
    }

    .btn{
        font-size:16px;
        padding:12px;
        margin:12px 0;
    }

}

/* ===========================
   Small Mobile (320px and below)
=========================== */
@media (max-width:320px){

    .container{
        padding:25px 15px;
    }

    h1{
        font-size:22px;
    }

    p{
        font-size:14px;
    }

    .btn{
        font-size:15px;
        padding:10px;
    }

}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#eef2f7;
}

.box{

width:450px;
background:white;
padding:35px;
border-radius:12px;
box-shadow:0 0 15px rgba(0,0,0,.2);

}

h2{
text-align:center;
margin-bottom:25px;
}

input{

width:100%;
padding:12px;
margin:12px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{

width:100%;
padding:12px;
background:#28a745;
color:white;
border:none;
border-radius:6px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#1f7d34;
}

a{
display:block;
text-align:center;
margin-top:20px;
text-decoration:none;
}

</style>

</head>

<body>

<div class="box">

<h2>User Registration</h2>

<form th:action="@{/register_user}" method="post">

<input type="text"
       name="username"
       placeholder="Username"
       required>

<input type="text"
       name="mobile"
       placeholder="Mobile Number"
       maxlength="10"
       required>

<input type="password"
       name="password"
       placeholder="Password"
       required>

<button type="submit">
Register
</button>

</form>

<a th:href="@{/login}">
Already have an account? Login
</a>

</div>

</body>
</html>
