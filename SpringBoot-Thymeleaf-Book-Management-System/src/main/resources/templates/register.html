<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:url('/images/background1.jpg') center center/cover no-repeat;

    position:relative;

    overflow:hidden;

}

/* Dark Overlay */

body::before{

    content:"";

    position:absolute;

    inset:0;

    background:rgba(8,15,35,.72);

}

/* Glass Card */

.box{

    position:relative;

    z-index:2;

    width:100%;
    max-width:460px;

    padding:42px;

    border-radius:22px;

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.18);

    box-shadow:0 20px 50px rgba(0,0,0,.35);

    color:white;

    animation:fade .8s;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(30px);

}

to{

opacity:1;
transform:translateY(0);

}

}

.logo{

    text-align:center;

    font-size:60px;

    margin-bottom:10px;

}

h2{

    text-align:center;

    font-size:32px;

    margin-bottom:8px;

}

.subtitle{

    text-align:center;

    color:#ddd;

    margin-bottom:30px;

    line-height:24px;

}

/* Input */

.input-group{

    margin-bottom:18px;

}

.input-group label{

    display:block;

    margin-bottom:7px;

    font-size:15px;

    font-weight:500;

}

.input-group input{

    width:100%;

    padding:15px;

    border:none;

    border-radius:10px;

    outline:none;

    font-size:15px;

    background:rgba(255,255,255,.95);

    transition:.3s;

}

.input-group input:focus{

    box-shadow:0 0 10px #4f8cff;

}

/* Button */

button{

    width:100%;

    padding:15px;

    margin-top:8px;

    border:none;

    border-radius:10px;

    font-size:18px;

    font-weight:600;

    color:white;

    cursor:pointer;

    background:linear-gradient(135deg,#2563eb,#1d4ed8);

    transition:.35s;

}

button:hover{

    transform:translateY(-3px);

    box-shadow:0 12px 28px rgba(37,99,235,.45);

}

/* Login Link */

.login{

    margin-top:25px;

    text-align:center;

    color:#ddd;

}

.login a{

    color:#FFD54F;

    text-decoration:none;

    font-weight:600;

}

.login a:hover{

    text-decoration:underline;

}

/* Responsive */

@media(max-width:600px){

.box{

width:92%;

padding:30px;

}

.logo{

font-size:50px;

}

h2{

font-size:28px;

}

.subtitle{

font-size:14px;

}

}

</style>

</head>

<body>

<div class="box">

<div class="logo">
📚
</div>

<h2>Create Account</h2>

<p class="subtitle">
Join the Library Management System and start managing books securely.
</p>

<form th:action="@{/register_user}" method="post">

<div class="input-group">

<label>Username</label>

<input
type="text"
name="username"
placeholder="Enter Username"
required>

</div>

<div class="input-group">

<label>Mobile Number</label>

<input
type="text"
name="mobile"
maxlength="10"
placeholder="Enter Mobile Number"
required>

</div>

<div class="input-group">

<label>Password</label>

<input
type="password"
name="password"
placeholder="Create Password"
required>

</div>

<button type="submit">
Create Account
</button>

</form>

<div class="login">

Already have an account?

<a th:href="@{/login}">
Login Here
</a>

</div>

</div>

</body>
</html>
