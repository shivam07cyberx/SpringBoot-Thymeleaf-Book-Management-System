<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>User Management</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    background:#f4f6f9;
    padding:30px;
}

.container{
    width:95%;
    margin:auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.header h2{
    color:#2c3e50;
}

.search{
    width:280px;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    outline:none;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

thead{
    background:#2c3e50;
    color:white;
}

th{
    padding:15px;
    text-align:left;
}

td{
    padding:14px;
    border-bottom:1px solid #eee;
}

tbody tr:hover{
    background:#f9f9f9;
}

.view-btn{
    text-decoration:none;
    background:#3498db;
    color:white;
    padding:8px 18px;
    border-radius:5px;
    font-size:14px;
    transition:.3s;
}

.view-btn:hover{
    background:#2980b9;
}

.badge{
    display:inline-block;
    padding:5px 12px;
    background:#27ae60;
    color:white;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

.empty{
    text-align:center;
    color:red;
    padding:30px;
}
</style>

</head>

<body>

<div class="container">

<div class="header">
<h2>User Details</h2>

<input type="text"
placeholder="Search User..."
class="search">
</div>

<table>

<thead>
<tr>
<th>User ID</th>
<th>Name</th>
<th>Mobile Number</th>
<th>Books Issued</th>
<th>Action</th>
</tr>
</thead>

<tbody>

<tr th:each="user : ${users}">

<td th:text="${user.id}"></td>

<td th:text="${user.username}"></td>

<td th:text="${user.mobile}"></td>

<td>
<span class="badge"
      th:text="${user.borrows.size()}">0</span>
</td>

<td>
<a th:href="@{/admin/user/{id}(id=${user.id})}"
class="view-btn">
View Details
</a>
</td>

</tr>

<tr th:if="${#lists.isEmpty(users)}">
<td colspan="5" class="empty">
No Users Found
</td>
</tr>

</tbody>

</table>

</div>

</body>
</html>
