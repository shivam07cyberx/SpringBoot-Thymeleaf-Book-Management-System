<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>

    <style>
    
    
    /* ===========================
   Tablet (768px and below)
=========================== */
@media (max-width:768px){

    .container{
        width:90%;
        padding:35px 25px;
    }

    h1{
        font-size:30px;
    }

    p{
        font-size:16px;
    }

    .btn{
        font-size:17px;
        padding:13px;
    }

}

/* ===========================
   Mobile (480px and below)
=========================== */
@media (max-width:480px){

    body{
        padding:20px;
    }

    .container{
        width:100%;
        padding:30px 20px;
        border-radius:12px;
    }

    h1{
        font-size:26px;
    }

    p{
        font-size:15px;
        margin-bottom:25px;
    }

    .btn{
        font-size:16px;
        padding:12px;
        margin:12px 0;
    }

}

/* ===========================
   Small Mobile (320px and below)
=========================== */
@media (max-width:320px){

    .container{
        padding:25px 15px;
    }

    h1{
        font-size:22px;
    }

    p{
        font-size:14px;
    }

    .btn{
        font-size:15px;
        padding:10px;
    }

}
    
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
        }

        .container{
            width:420px;
            background:#fff;
            padding:40px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,.2);
        }

        h1{
            color:#333;
            margin-bottom:10px;
        }

        p{
            color:#666;
            margin-bottom:30px;
        }

        .btn{
            display:block;
            width:100%;
            padding:14px;
            margin:15px 0;
            text-decoration:none;
            font-size:18px;
            color:white;
            border-radius:8px;
            transition:.3s;
        }

        .login{
            background:#007bff;
        }

        .login:hover{
            background:#0056b3;
        }

        .register{
            background:#28a745;
        }

        .register:hover{
            background:#1f7d34;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Welcome</h1>

    <p> SHIVAM's Spring Boot Security Authentication System</p>

    <a th:href="@{/login}" class="btn login">Login</a>

    <a th:href="@{/register}" class="btn register">Register</a>

</div>

</body>
</html>
