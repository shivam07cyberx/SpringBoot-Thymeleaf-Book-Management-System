<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Book</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.container{
    width:850px;
    background:#fff;
    border-radius:15px;
    padding:35px;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
}

.container h2{
    text-align:center;
    margin-bottom:30px;
    color:#333;
    font-size:30px;
}

.form-row{
    display:flex;
    gap:20px;
    margin-bottom:18px;
}

.form-group{
    flex:1;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#444;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    transition:.3s;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#667eea;
    outline:none;
    box-shadow:0 0 8px rgba(102,126,234,.4);
}

textarea{
    resize:none;
    height:120px;
}

.full-width{
    width:100%;
    margin-bottom:20px;
}

.btn-group{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:20px;
}

button{
    width:180px;
    padding:12px;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

.save{
    background:#28a745;
    color:white;
}

.save:hover{
    background:#218838;
}

.reset{
    background:#dc3545;
    color:white;
}

.reset:hover{
    background:#c82333;
}

.back{
    margin-top:25px;
    text-align:center;
}

.back a{
    text-decoration:none;
    color:#667eea;
    font-weight:bold;
}

.back a:hover{
    text-decoration:underline;
}

.message{
    margin-top:20px;
    background:#d4edda;
    color:#155724;
    padding:12px;
    border-radius:8px;
    border:1px solid #c3e6cb;
    text-align:center;
    font-weight:bold;
}

/* ===========================
   Tablet
=========================== */

@media(max-width:768px){

    .container{
        width:95%;
        padding:25px;
    }

    .form-row{
        flex-direction:column;
        gap:0;
    }

    button{
        width:100%;
    }

    .btn-group{
        flex-direction:column;
    }

}

/* ===========================
   Mobile
=========================== */

@media(max-width:480px){

    .container h2{
        font-size:24px;
    }

    input,
    textarea,
    select{
        font-size:14px;
    }

}

</style>

</head>

<body>

<div class="container">

<h2>📚 Add New Book</h2>

<form th:action="@{/books/save}" method="post">

    <div class="form-row">

        <div class="form-group">
            <label>Book Name</label>
            <input
                type="text"
                name="bookname"
                placeholder="Enter Book Name"
                required>
        </div>

        <div class="form-group">
            <label>Title</label>
            <input
                type="text"
                name="title"
                placeholder="Enter Book Title"
                required>
        </div>

    </div>

    <div class="form-row">

        <div class="form-group">
            <label>Author</label>
            <input
                type="text"
                name="author"
                placeholder="Enter Author Name"
                required>
        </div>

        <div class="form-group">
            <label>Category</label>

            <select name="category" required>

                <option value="">Select Category</option>
                <option>Java</option>
                <option>Spring Boot</option>
                <option>Database</option>
                <option>Python</option>
                <option>Web Development</option>
                <option>Machine Learning</option>
                <option>Networking</option>
                <option>Other</option>

            </select>

        </div>

    </div>

    <div class="form-row">

        <div class="form-group">
            <label>Price</label>
            <input
                type="number"
                step="0.01"
                name="price"
                placeholder="Enter Price"
                required>
        </div>

        <div class="form-group">
            <label>Total Book Count</label>
            <input
                type="number"
                name="bookCount"
                placeholder="Total Copies"
                min="1"
                required>
        </div>

    </div>

  <!--   <div class="form-row">

        <div class="form-group">
            <label>Available Book Count</label>
            <input
                type="number"
                name="availableBookCount"
                placeholder="Available Copies"
                min="0"
                required>
        </div>

        <div class="form-group">
        </div> 

    </div>  -->

    <div class="form-group full-width">

        <label>Description</label>

        <textarea
            name="description"
            placeholder="Enter Book Description"
            required></textarea>

    </div>

    <div class="btn-group">

        <button
            class="save"
            type="submit">
            💾 Save Book
        </button>

        <button
            class="reset"
            type="reset">
            🔄 Reset
        </button>

    </div>

</form>

<div class="back">

<a th:href="@{/dashboard}">
⬅ Back to Dashboard
</a>

</div>

<div
th:if="${msg}"
class="message">

<span th:text="${msg}"></span>

</div>

</div>

</body>
</html>
