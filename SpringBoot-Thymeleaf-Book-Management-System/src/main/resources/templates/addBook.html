<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Book</title>

<style>






/* ===========================
   Tablet (768px and below)
=========================== */
@media (max-width:768px){

    .container{
        width:90%;
        padding:35px 25px;
    }

    h1{
        font-size:30px;
    }

    p{
        font-size:16px;
    }

    .btn{
        font-size:17px;
        padding:13px;
    }

}

/* ===========================
   Mobile (480px and below)
=========================== */
@media (max-width:480px){

    body{
        padding:20px;
    }

    .container{
        width:100%;
        padding:30px 20px;
        border-radius:12px;
    }

    h1{
        font-size:26px;
    }

    p{
        font-size:15px;
        margin-bottom:25px;
    }

    .btn{
        font-size:16px;
        padding:12px;
        margin:12px 0;
    }

}

/* ===========================
   Small Mobile (320px and below)
=========================== */
@media (max-width:320px){

    .container{
        padding:25px 15px;
    }

    h1{
        font-size:22px;
    }

    p{
        font-size:14px;
    }

    .btn{
        font-size:15px;
        padding:10px;
    }

}








*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#667eea,#764ba2);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:450px;
    background:#fff;
    border-radius:15px;
    padding:30px;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
}

.container h2{
    text-align:center;
    margin-bottom:25px;
    color:#333;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#444;
}

input,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    transition:.3s;
}

input:focus,
textarea:focus{
    border-color:#667eea;
    outline:none;
    box-shadow:0 0 8px rgba(102,126,234,.4);
}

textarea{
    resize:none;
    height:100px;
}

.btn-group{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
}

button{
    width:48%;
    padding:12px;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

.save{
    background:#28a745;
    color:white;
}

.save:hover{
    background:#218838;
}

.reset{
    background:#dc3545;
    color:white;
}

.reset:hover{
    background:#c82333;
}

.back{
    margin-top:20px;
    text-align:center;
}

.back a{
    text-decoration:none;
    color:#667eea;
    font-weight:bold;
}

.back a:hover{
    text-decoration:underline;
}
</style>

</head>
<body>

<div class="container">

    <h2>📚 Add New Book</h2>

    <form th:action="@{/books/save}" method="post">

        <div class="form-group">
            <label>Book Name</label>
            <input type="text" name="bookname" placeholder="Enter Book Name" required>
        </div>

        <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" placeholder="Enter Book Title" required>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea name="description"
                placeholder="Enter Book Description"
                required></textarea>
        </div>

        <div class="form-group">
            <label>Price</label>
            <input type="number" step="0.01" name="price"
                placeholder="Enter Price" required>
        </div>

        <div class="btn-group">
            <button class="save" type="submit">💾 Save</button>
            <button class="reset" type="reset">🔄 Reset</button>
        </div>

    </form>

    <div class="back">
        <a th:href="@{/dashboard}">⬅ Back to Dashboard</a>
    </div>
<div th:if="${msg}"
     style="background:#d4edda;
            color:#155724;
            padding:12px;
            margin-bottom:20px;
            border-radius:8px;
            border:1px solid #c3e6cb;
            text-align:center;
            font-weight:bold;">

    <span th:text="${msg}"></span>

</div>
</div>

</body>
</html>
