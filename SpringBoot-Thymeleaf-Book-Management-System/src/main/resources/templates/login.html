<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#f4f4f4;
}

.box{

width:420px;
background:white;
padding:35px;
border-radius:12px;
box-shadow:0 0 15px rgba(0,0,0,.2);

}

h2{
text-align:center;
margin-bottom:25px;
}

input{

width:100%;
padding:12px;
margin:12px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{

width:100%;
padding:12px;
background:#007bff;
color:white;
border:none;
border-radius:6px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

a{
display:block;
text-align:center;
margin-top:20px;
text-decoration:none;
}

</style>

</head>

<body>

<div class="box">

<h2>User Login</h2>

<form th:action="@{/login}" method="post">

<input type="text"
       name="username"
       placeholder="Username"
       required>

<input type="password"
       name="password"
       placeholder="Password"
       required>

<button type="submit">
Login
</button>

</form>

<a th:href="@{/register}">
Create New Account
</a>

</div>

</body>
</html>
