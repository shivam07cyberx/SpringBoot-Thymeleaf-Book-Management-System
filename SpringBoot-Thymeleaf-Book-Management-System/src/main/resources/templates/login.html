<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Library Login</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:url('/images/library-bg.jpg') center/cover no-repeat;
}

/* Dark overlay */

body::before{

content:"";
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.55);

}

/* Main Container */

.container{

position:relative;
z-index:2;

display:flex;
align-items:center;
justify-content:center;
gap:30px;

padding:20px;

}

/* Side Images */

.side-image{

width:280px;
height:420px;

border-radius:15px;
overflow:hidden;

box-shadow:0 10px 30px rgba(0,0,0,.4);

}

.side-image img{

width:100%;
height:100%;
object-fit:cover;

}

/* Login Card */

.login-box{

width:400px;

padding:40px;

background:rgba(255,255,255,.15);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.2);

border-radius:18px;

box-shadow:0 15px 40px rgba(0,0,0,.4);

text-align:center;

color:white;

}

.logo{

font-size:60px;
margin-bottom:10px;

}

.login-box h2{

margin-bottom:5px;

}

.login-box p{

margin-bottom:25px;
color:#eee;

}

/* Input */

.input-group{

margin-bottom:18px;
text-align:left;

}

.input-group label{

display:block;
margin-bottom:7px;

font-size:15px;

}

.input-group input{

width:100%;
padding:14px;

border:none;

border-radius:8px;

font-size:15px;

outline:none;

}

/* Button */

button{

width:100%;
padding:14px;

border:none;

border-radius:8px;

background:#ff9800;

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#f57c00;
transform:translateY(-2px);

}

.register{

margin-top:20px;

}

.register a{

color:#FFD54F;
text-decoration:none;
font-weight:bold;

}

.register a:hover{

text-decoration:underline;

}

.error{

background:#ffebee;
color:red;

padding:10px;
border-radius:5px;
margin-bottom:15px;

}

.success{

background:#e8f5e9;
color:green;

padding:10px;
border-radius:5px;
margin-bottom:15px;

}

/* Responsive */

@media(max-width:992px){

.side-image{

display:none;

}

.login-box{

width:100%;
max-width:420px;

}

}

@media(max-width:500px){

.login-box{

padding:25px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="side-image">
<img th:src="@{/images/library1.jpg}">
</div>

<div class="login-box">

<div class="logo">📚</div>

<h2>Library Management System</h2>

<p>Login to Continue</p>

<div th:if="${param.error}" class="error">
Invalid Username or Password
</div>

<div th:if="${param.logout}" class="success">
Logged Out Successfully
</div>

<form th:action="@{/login}" method="post">

<div class="input-group">

<label>Username</label>

<input
type="text"
name="username"
placeholder="Enter Username"
required>

</div>

<div class="input-group">

<label>Password</label>

<input
type="password"
name="password"
placeholder="Enter Password"
required>

</div>

<button type="submit">
LOGIN
</button>

</form>

<div class="register">

Don't have an account?

<a th:href="@{/register}">
Register Here
</a>

</div>

</div>

<div class="side-image">
<img th:src="@{/images/library2.jpg}">
</div>

</div>

</body>
</html>
