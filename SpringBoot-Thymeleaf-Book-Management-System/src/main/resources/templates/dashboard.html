<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
<meta charset="UTF-8">
<title>Library Dashboard</title>

<style>

/* ===========================
   Tablet (768px and below)
=========================== */
@media (max-width:768px){

    .container{
        width:90%;
        padding:35px 25px;
    }

    h1{
        font-size:30px;
    }

    p{
        font-size:16px;
    }

    .btn{
        font-size:17px;
        padding:13px;
    }

}

/* ===========================
   Mobile (480px and below)
=========================== */
@media (max-width:480px){

    body{
        padding:20px;
    }

    .container{
        width:100%;
        padding:30px 20px;
        border-radius:12px;
    }

    h1{
        font-size:26px;
    }

    p{
        font-size:15px;
        margin-bottom:25px;
    }

    .btn{
        font-size:16px;
        padding:12px;
        margin:12px 0;
    }

}

/* ===========================
   Small Mobile (320px and below)
=========================== */
@media (max-width:320px){

    .container{
        padding:25px 15px;
    }

    h1{
        font-size:22px;
    }

    p{
        font-size:14px;
    }

    .btn{
        font-size:15px;
        padding:10px;
    }

}


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#eef2f7;
}

/* Header */

.header{
    background:#1f2937;
    color:white;
    padding:25px;
    text-align:center;
}

.header h1{
    margin-bottom:10px;
}

.header p{
    margin-top:10px;
    font-size:18px;
}

/* Dashboard */

.container{
    width:90%;
    max-width:1100px;
    margin:40px auto;
}

.card{
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 10px 20px rgba(0,0,0,.15);
}

.card h2{
    text-align:center;
    margin-bottom:30px;
    color:#333;
}

/* Menu */

.menu{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

    gap:20px;

}

.menu a{

    text-decoration:none;

    color:white;

    padding:25px;

    border-radius:10px;

    text-align:center;

    font-size:20px;

    font-weight:bold;

    transition:.3s;

}

.menu a:hover{

    transform:translateY(-5px);

    box-shadow:0 8px 18px rgba(0,0,0,.25);

}

.add{
    background:#28a745;
}

.update{
    background:#0d6efd;
}

.delete{
    background:#dc3545;
}

.view{
    background:#17a2b8;
}

/* Logout */

.logout-area{

    text-align:center;

    margin-top:40px;

}

.logout-btn{

    background:#343a40;

    color:white;

    border:none;

    padding:15px 35px;

    font-size:18px;

    border-radius:8px;

    cursor:pointer;

    transition:.3s;

}

.logout-btn:hover{

    background:#212529;

    transform:scale(1.05);

}

/* Footer */

.footer{

    margin-top:40px;

    text-align:center;

    color:#666;

}

</style>

</head>

<body>

<div class="header">

    <h1>📚 Library Management System</h1>

    <p>
        Welcome,
        <strong>
            <span sec:authentication="name"></span>
        </strong>
    </p>

    <p>

        Role :

        <strong sec:authorize="hasRole('ADMIN')">
            ADMIN
        </strong>

        <strong sec:authorize="hasRole('USER')">
            USER
        </strong>

    </p>

</div>

<div class="container">

<div class="card">

<h2>Dashboard</h2>

<div class="menu">

    <!-- ADMIN -->

    <a th:href="@{/books/add-form}"
       class="add"
       sec:authorize="hasRole('ADMIN')">

        ➕ Add Book

    </a>

    <a th:href="@{/books/update}"
       class="update"
       sec:authorize="hasRole('ADMIN')">

        ✏ Update Book

    </a>

    <a th:href="@{/books/delete}"
       class="delete"
       sec:authorize="hasRole('ADMIN')">

        🗑 Delete Book

    </a>

    <!-- ADMIN + USER -->

    <a th:href="@{/books/view}"
       class="view">

        📚 View Books

    </a>

</div>

<div class="logout-area">

<form th:action="@{/logout}" method="post">

    <button type="submit" class="logout-btn">

        🚪 Logout

    </button>

</form>

</div>

</div>

</div>

<div class="footer">

    <h3>© 2026 SHIVAM's Library Management System</h3>

</div>

</body>
</html>
